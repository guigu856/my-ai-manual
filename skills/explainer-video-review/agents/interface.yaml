interface:
  display_name: "Explainer Video Review"
  short_description: "Audit rendered concept-motion explainer videos with evidence-linked findings across four dimensions"
  default_prompt: "Use this skill to inventory the rendered MP4 and its frozen basis, build a deterministic sampling plan, run media preflight, review visual expression, spatial continuity, temporal alignment, subtitle readability, and technical integrity, then return review-report.json plus a repair handoff. Label missing evidence and keep source edits in the production Skill."
  examples:
    - "审查这个概念动效视频成片，输出带时间戳的问题清单"
    - "检查这个 MP4 的字幕、音画同步和动效连贯性"
    - "逐帧找出这个解说视频的视觉表达问题，并给出修复建议"
    - "根据 timeline.json 复核成片，标出所有 major 和 blocker 问题"
    - "把这次成片审查整理成 review-report.json 并交给生产 Skill 修复"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths:
      - "skills/explainer-video-review"
  execution:
    context: "inline"
    shell: "powershell/bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow read-only source and catalog review; require explicit user input for external writes"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "optional source and provider metadata lookup only"
    file_write: "review project directory and report artifacts only when requested"
    subprocess: "ffprobe, FFmpeg, bundled sampling/report validators, and configured media tools"
    interactive: "only for missing review basis, hard blockers, or user acceptance of warnings"
  degradation:
    openai: "canonical source"
    claude: "canonical source plus minimal adapter"
    generic: "canonical source"
    agent-skills-compatible: "canonical source"
    vscode: "canonical source plus interface metadata"
gates:
  scaffold:
    - "frontmatter has name, description, trigger scope, and explicit exclusions"
    - "README has natural-language triggers and a validation hook"
    - "review input/output and evidence boundary are stated"
  production:
    - "four review dimensions and technical preflight are present"
    - "sampling presets and evidence references are deterministic"
    - "trigger cases cover positive, negative, and near-neighbor requests"
    - "review report validator is runnable"
    - "repair handoff and full-rerender loop are explicit"
    - "runtime, playback, and human evidence claims are labeled"
  library:
    - "Skill IR and prior-art report are present"
    - "platform and degradation metadata are present"
    - "review cadence and owner are declared"
  governed:
    - "rollback, trust, secret, and publication boundaries are present"
